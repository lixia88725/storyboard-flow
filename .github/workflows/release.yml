name: CI and single-repository release

on:
  pull_request:
  push:
    branches: [main, infra/public-repository]
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Stable numeric version greater than 0.1.30 and latest, without v'
        required: true
        type: string

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python -m pip install --target vendor/python/photoshop-tiff -r vendor/python/photoshop-tiff/requirements.txt
      - run: npm test
      - run: npm run build
      - run: npm run check:preload

  metadata:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.target.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: node scripts/repository-release.mjs resolve
      - id: target
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          sha="$(git rev-parse HEAD)"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            main_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
            git cat-file -e "$main_sha^{commit}"
            git merge-base --is-ancestor "$sha" "$main_sha"
          fi
          printf 'sha=%s\n' "$sha" >> "$GITHUB_OUTPUT"

  package:
    needs: [test, metadata]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            platform: windows
            arch: x64
            asset: Storyboard-Flow-Windows-x64.zip
          - runner: macos-14
            platform: macos
            arch: arm64
            asset: Storyboard-Flow-macOS-arm64.zip
    runs-on: ${{ matrix.runner }}
    env:
      STORYBOARD_FLOW_VERSION: ${{ needs.metadata.outputs.version }}
      STORYBOARD_FLOW_PACKAGE_DIR: ${{ github.workspace }}/release-artifacts
      STORYBOARD_FLOW_MAC_ARCH: arm64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.metadata.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          architecture: ${{ matrix.arch }}
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: ${{ matrix.arch }}
      - name: Assert native architecture
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: node -e "if(process.arch !== process.env.EXPECTED_ARCH) process.exit(1)"
      - run: npm ci
      - run: python -m pip install --target vendor/python/photoshop-tiff -r vendor/python/photoshop-tiff/requirements.txt
      - run: npm run package:${{ matrix.platform }}
      - name: Validate ZIP contents and notices
        env:
          EXPECTED_ASSET: ${{ matrix.asset }}
        run: python scripts/validate-release-package.py
      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.platform }}
          path: release-artifacts/**/${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 14

  publish:
    # Unset/false is safe: preparation never publishes baseline code.
    if: >-
      vars.RELEASE_ENABLED == 'true' &&
      github.repository == 'lixia88725/storyboard-flow' &&
      (github.ref == 'refs/heads/main' ||
       (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')))
    needs: [metadata, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: storyboard-flow-release-publication
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.metadata.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: release-artifacts
          merge-multiple: true
      - name: Stage, verify, publish, then advance updates branch
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ needs.metadata.outputs.sha }}
          STORYBOARD_FLOW_VERSION: ${{ needs.metadata.outputs.version }}
        run: node scripts/repository-release.mjs publish release-artifacts
