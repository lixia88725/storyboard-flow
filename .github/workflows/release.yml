name: Release Storyboard Flow

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without v prefix"
        required: true
        type: string

env:
  RELEASE_REPO: lixia88725/storyboard-flow-releases

jobs:
  test:
    name: Test
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - name: Install macOS Photoshop TIFF Python deps
        run: python -m pip install --target vendor/python/photoshop-tiff -r vendor/python/photoshop-tiff/requirements.txt
      - run: npm run test
      - run: npm run typecheck

  prepare-release:
    name: Prepare public release
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve release metadata
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            version="${{ inputs.version }}"
          elif [[ "${{ github.ref_type }}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            base_version="$(node -p "const v=require('./package.json').version.split('.'); v[0]+'.'+v[1]")"
            version="${base_version}.${{ github.run_number }}"
          fi
          echo "STORYBOARD_FLOW_VERSION=$version" >> "$GITHUB_ENV"
          echo "STORYBOARD_FLOW_TAG=v$version" >> "$GITHUB_ENV"
      - name: Create empty public release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_REPO_TOKEN }}
        run: |
          gh release delete "$STORYBOARD_FLOW_TAG" --repo "$RELEASE_REPO" --yes --cleanup-tag || true
          gh release create "$STORYBOARD_FLOW_TAG" \
            --repo "$RELEASE_REPO" \
            --title "Storyboard Flow $STORYBOARD_FLOW_VERSION" \
            --notes "Storyboard Flow $STORYBOARD_FLOW_VERSION"

  package-windows:
    name: Package Windows portable
    needs: prepare-release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Resolve version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $version = "${{ inputs.version }}"
          } elseif ("${{ github.ref_type }}" -eq "tag") {
            $version = $env:GITHUB_REF_NAME -replace '^v',''
          } else {
            $baseVersion = node -p "const v=require('./package.json').version.split('.'); v[0]+'.'+v[1]"
            $version = "$baseVersion.${{ github.run_number }}"
          }
          "STORYBOARD_FLOW_VERSION=$version" >> $env:GITHUB_ENV
          "STORYBOARD_FLOW_TAG=v$version" >> $env:GITHUB_ENV
      - run: npm ci
      - name: Install Windows Photoshop TIFF Python deps
        shell: pwsh
        run: python -m pip install --target vendor/python/photoshop-tiff -r vendor/python/photoshop-tiff/requirements.txt
      - name: Package Windows portable zip
        shell: pwsh
        env:
          STORYBOARD_FLOW_PACKAGE_DIR: ${{ github.workspace }}\release-artifacts
          STORYBOARD_FLOW_WINDOWS_PYTHON_DIR: ${{ env.pythonLocation }}
        run: npm run package:windows
      - name: Upload Windows release asset
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RELEASE_REPO_TOKEN }}
        run: gh release upload "$env:STORYBOARD_FLOW_TAG" release-artifacts/*.zip --repo "$env:RELEASE_REPO" --clobber

  package-macos:
    name: Package macOS
    needs: prepare-release
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Resolve version
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            version="${{ inputs.version }}"
          elif [[ "${{ github.ref_type }}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            base_version="$(node -p "const v=require('./package.json').version.split('.'); v[0]+'.'+v[1]")"
            version="${base_version}.${{ github.run_number }}"
          fi
          echo "STORYBOARD_FLOW_VERSION=$version" >> "$GITHUB_ENV"
          echo "STORYBOARD_FLOW_TAG=v$version" >> "$GITHUB_ENV"
      - run: npm ci
      - name: Install macOS Photoshop TIFF Python deps
        run: python -m pip install --target vendor/python/photoshop-tiff -r vendor/python/photoshop-tiff/requirements.txt
      - name: Package macOS zip
        env:
          STORYBOARD_FLOW_PACKAGE_DIR: ${{ github.workspace }}/release-artifacts
        run: npm run package:macos
      - name: Upload macOS release asset
        env:
          GH_TOKEN: ${{ secrets.RELEASE_REPO_TOKEN }}
        run: gh release upload "$STORYBOARD_FLOW_TAG" release-artifacts/*.zip --repo "$RELEASE_REPO" --clobber

  publish:
    name: Publish release assets
    needs:
      - package-windows
      - package-macos
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Resolve release metadata
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            version="${{ inputs.version }}"
          elif [[ "${{ github.ref_type }}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            base_version="$(node -p "const v=require('./package.json').version.split('.'); v[0]+'.'+v[1]")"
            version="${base_version}.${{ github.run_number }}"
          fi
          echo "STORYBOARD_FLOW_VERSION=$version" >> "$GITHUB_ENV"
          echo "STORYBOARD_FLOW_TAG=v$version" >> "$GITHUB_ENV"
      - name: Update public update.json
        env:
          GH_TOKEN: ${{ secrets.RELEASE_REPO_TOKEN }}
        shell: bash
        run: |
          release_url="https://github.com/$RELEASE_REPO/releases/tag/$STORYBOARD_FLOW_TAG"
          asset_base="https://github.com/$RELEASE_REPO/releases/download/$STORYBOARD_FLOW_TAG"
          asset_names="$(gh release view "$STORYBOARD_FLOW_TAG" --repo "$RELEASE_REPO" --json assets --jq '.assets[].name')"
          windows_url="$asset_base/Storyboard-Flow-Windows-x64.zip"
          macos_arm64_url=""
          macos_x64_url=""

          echo "$asset_names" | grep -Fx "Storyboard-Flow-Windows-x64.zip" >/dev/null
          if echo "$asset_names" | grep -Fx "Storyboard-Flow-macOS-arm64.zip" >/dev/null; then
            macos_arm64_url="$asset_base/Storyboard-Flow-macOS-arm64.zip"
          fi
          if echo "$asset_names" | grep -Fx "Storyboard-Flow-macOS-x64.zip" >/dev/null; then
            macos_x64_url="$asset_base/Storyboard-Flow-macOS-x64.zip"
          fi
          export release_url windows_url macos_arm64_url macos_x64_url

          mkdir release-repo
          gh repo clone "$RELEASE_REPO" release-repo -- --depth 1
          node -e '
            const fs = require("fs");
            const manifest = {
              latest: process.env.STORYBOARD_FLOW_VERSION,
              notes: `Storyboard Flow ${process.env.STORYBOARD_FLOW_VERSION}`,
              releaseUrl: process.env.release_url,
              downloads: {
                windowsPortable: process.env.windows_url
              }
            };
            if (process.env.macos_arm64_url) manifest.downloads.macosAppleSilicon = process.env.macos_arm64_url;
            if (process.env.macos_x64_url) manifest.downloads.macosIntel = process.env.macos_x64_url;
            fs.writeFileSync("release-repo/update.json", `${JSON.stringify(manifest, null, 2)}\n`);
          '
          node scripts/generate-release-readme.mjs release-repo/README.md
          cd release-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update.json README.md
          git commit -m "Update Storyboard Flow $STORYBOARD_FLOW_VERSION release info" || exit 0
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${RELEASE_REPO}.git"
          git push
