name: Release Storyboard Flow

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without v prefix"
        required: true
        type: string

env:
  RELEASE_REPO: lixia88725/storyboard-flow-releases

jobs:
  test:
    name: Test
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - name: Install macOS Photoshop TIFF Python deps
        run: python -m pip install --target vendor/python/photoshop-tiff -r vendor/python/photoshop-tiff/requirements.txt
      - run: npm run test
      - run: npm run typecheck

  package-windows:
    name: Package Windows portable
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Resolve version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            "STORYBOARD_FLOW_VERSION=${{ inputs.version }}" >> $env:GITHUB_ENV
          } else {
            "STORYBOARD_FLOW_VERSION=$($env:GITHUB_REF_NAME -replace '^v','')" >> $env:GITHUB_ENV
          }
      - run: npm ci
      - name: Install Windows Photoshop TIFF Python deps
        shell: pwsh
        run: python -m pip install --target vendor/python/photoshop-tiff -r vendor/python/photoshop-tiff/requirements.txt
      - name: Package Windows portable zip
        shell: pwsh
        env:
          STORYBOARD_FLOW_PACKAGE_DIR: ${{ github.workspace }}\release-artifacts
          STORYBOARD_FLOW_WINDOWS_PYTHON_DIR: ${{ env.pythonLocation }}
        run: npm run package:windows
      - uses: actions/upload-artifact@v4
        with:
          name: windows-portable
          path: release-artifacts/**/*.zip
          if-no-files-found: error

  package-macos:
    name: Package macOS
    needs: test
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Resolve version
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "STORYBOARD_FLOW_VERSION=${{ inputs.version }}" >> "$GITHUB_ENV"
          else
            echo "STORYBOARD_FLOW_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          fi
      - run: npm ci
      - name: Install macOS Photoshop TIFF Python deps
        run: python -m pip install --target vendor/python/photoshop-tiff -r vendor/python/photoshop-tiff/requirements.txt
      - name: Package macOS zip
        env:
          STORYBOARD_FLOW_PACKAGE_DIR: ${{ github.workspace }}/release-artifacts
        run: npm run package:macos
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: release-artifacts/**/*.zip
          if-no-files-found: error

  publish:
    name: Publish release assets
    needs:
      - package-windows
      - package-macos
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Collect release zips
        shell: bash
        run: |
          mkdir -p release-zips
          find artifacts -type f -name "*.zip" -exec cp {} release-zips/ \;
          ls -lh release-zips
          test -f release-zips/Storyboard-Flow-Windows-x64.zip
      - name: Resolve release metadata
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          echo "STORYBOARD_FLOW_VERSION=$version" >> "$GITHUB_ENV"
          echo "STORYBOARD_FLOW_TAG=v$version" >> "$GITHUB_ENV"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_REPO_TOKEN }}
        run: |
          gh release delete "$STORYBOARD_FLOW_TAG" --repo "$RELEASE_REPO" --yes --cleanup-tag || true
          gh release create "$STORYBOARD_FLOW_TAG" release-zips/*.zip \
            --repo "$RELEASE_REPO" \
            --title "Storyboard Flow $STORYBOARD_FLOW_VERSION" \
            --notes "Storyboard Flow $STORYBOARD_FLOW_VERSION"
      - name: Update public update.json
        env:
          GH_TOKEN: ${{ secrets.RELEASE_REPO_TOKEN }}
        shell: bash
        run: |
          release_url="https://github.com/$RELEASE_REPO/releases/tag/$STORYBOARD_FLOW_TAG"
          asset_base="https://github.com/$RELEASE_REPO/releases/download/$STORYBOARD_FLOW_TAG"
          windows_url="$asset_base/Storyboard-Flow-Windows-x64.zip"
          macos_arm64_url=""
          macos_x64_url=""

          if [[ -f release-zips/Storyboard-Flow-macOS-arm64.zip ]]; then
            macos_arm64_url="$asset_base/Storyboard-Flow-macOS-arm64.zip"
          fi
          if [[ -f release-zips/Storyboard-Flow-macOS-x64.zip ]]; then
            macos_x64_url="$asset_base/Storyboard-Flow-macOS-x64.zip"
          fi
          export release_url windows_url macos_arm64_url macos_x64_url

          mkdir release-repo
          gh repo clone "$RELEASE_REPO" release-repo -- --depth 1
          cd release-repo
          node -e '
            const fs = require("fs");
            const manifest = {
              latest: process.env.STORYBOARD_FLOW_VERSION,
              notes: `Storyboard Flow ${process.env.STORYBOARD_FLOW_VERSION}`,
              releaseUrl: process.env.release_url,
              downloads: {
                windowsPortable: process.env.windows_url
              }
            };
            if (process.env.macos_arm64_url) manifest.downloads.macosAppleSilicon = process.env.macos_arm64_url;
            if (process.env.macos_x64_url) manifest.downloads.macosIntel = process.env.macos_x64_url;
            fs.writeFileSync("update.json", `${JSON.stringify(manifest, null, 2)}\n`);
          '
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update.json
          git commit -m "Update Storyboard Flow $STORYBOARD_FLOW_VERSION manifest" || exit 0
          git push
