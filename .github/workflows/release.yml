name: CI and single-repository release

on:
  pull_request:
  push:
    branches: [main, infra/public-repository]
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Stable numeric version greater than 0.1.30 and latest, without v'
        required: true
        type: string

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    env:
      FLOW_PYTHON_DEPS_DIR: ${{ github.workspace }}/vendor/python/photoshop-tiff
      PYTHONDONTWRITEBYTECODE: '1'
      RUSTUP_TOOLCHAIN: '1.99.1'
      FLOW_PHOTOCRAFT_TARGET: aarch64-apple-darwin
    steps:
      - name: Set isolated test temporary directory
        shell: bash
        run: printf 'TMPDIR=%s\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python -m pip install --target vendor/python/photoshop-tiff -r vendor/python/photoshop-tiff/requirements.txt
      - name: Isolate Rust dependency homes
        shell: bash
        run: |
          printf 'RUSTUP_HOME=%s/flow-rustup\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'CARGO_HOME=%s/flow-cargo\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Install fixed native Rust toolchain
        shell: bash
        run: rustup toolchain install 1.99.1 --profile minimal --no-self-update
      - run: npm run setup:photocraft
      - run: npm run build:photocraft
      - run: npm run build
      - name: Run explicitly approved test suite
        # macOS arm64 runners have 7 GB RAM and vitest runs a single worker here. The heaviest
        # approved file (flowTiffSave) peaks near 3.4 GB resident, so the default ~2 GB old
        # space aborts it. 4 GB is a bounded ceiling with room for the runner's own processes.
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: >-
          node --input-type=module -e 'import fs from "node:fs"; import {spawnSync} from "node:child_process"; const files=JSON.parse(fs.readFileSync("test/allowed-suite.json","utf8")); const r=spawnSync(process.execPath,["node_modules/vitest/vitest.mjs","run",...files],{stdio:"inherit"}); if(r.error) throw r.error; process.exit(r.status ?? 1);'
      - run: npm run check:preload

  metadata:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.target.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: node scripts/repository-release.mjs resolve
      - id: target
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          sha="$(git rev-parse HEAD)"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            main_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
            git cat-file -e "$main_sha^{commit}"
            git merge-base --is-ancestor "$sha" "$main_sha"
          fi
          printf 'sha=%s\n' "$sha" >> "$GITHUB_OUTPUT"

  package:
    needs: [test, metadata]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            platform: windows
            arch: x64
            native_target: x86_64-pc-windows-msvc
            asset: Storyboard-Flow-Windows-x64.zip
          - runner: macos-15
            platform: macos
            arch: arm64
            native_target: aarch64-apple-darwin
            asset: Storyboard-Flow-macOS-arm64.zip
    runs-on: ${{ matrix.runner }}
    env:
      STORYBOARD_FLOW_VERSION: ${{ needs.metadata.outputs.version }}
      STORYBOARD_FLOW_PACKAGE_DIR: ${{ github.workspace }}/release-artifacts
      STORYBOARD_FLOW_MAC_ARCH: arm64
      RUSTUP_TOOLCHAIN: '1.99.1'
      FLOW_PHOTOCRAFT_TARGET: ${{ matrix.native_target }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.metadata.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          architecture: ${{ matrix.arch }}
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: ${{ matrix.arch }}
      - name: Assert native architecture
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: node -e "if(process.arch !== process.env.EXPECTED_ARCH) process.exit(1)"
      - run: npm ci
      - run: python -m pip install --target vendor/python/photoshop-tiff -r vendor/python/photoshop-tiff/requirements.txt
      - name: Check hosted Windows MSVC prerequisites
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (!(Test-Path $vswhere)) { throw 'Hosted runner is missing Visual Studio discovery tools' }
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$vs) { throw 'Hosted runner is missing MSVC x64 build tools' }
      - name: Isolate Rust dependency homes
        shell: bash
        run: |
          printf 'RUSTUP_HOME=%s/flow-rustup\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'CARGO_HOME=%s/flow-cargo\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Install fixed native Rust toolchain
        shell: bash
        run: rustup toolchain install 1.99.1 --profile minimal --no-self-update
      - run: npm run setup:photocraft
      - run: npm run build:photocraft
      - run: npm run package:${{ matrix.platform }}
      - name: Validate ZIP contents and notices
        env:
          EXPECTED_ASSET: ${{ matrix.asset }}
        run: python scripts/validate-release-package.py
      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.platform }}
          path: release-artifacts/**/${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 14

  publish:
    # Unset/false is safe: preparation never publishes baseline code.
    if: >-
      vars.RELEASE_ENABLED == 'true' &&
      github.repository == 'lixia88725/storyboard-flow' &&
      (github.ref == 'refs/heads/main' ||
       (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')))
    needs: [metadata, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: storyboard-flow-release-publication
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.metadata.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: release-artifacts
          merge-multiple: true
      - name: Stage, verify, publish, then advance updates branch
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ needs.metadata.outputs.sha }}
          STORYBOARD_FLOW_VERSION: ${{ needs.metadata.outputs.version }}
        run: node scripts/repository-release.mjs publish release-artifacts
