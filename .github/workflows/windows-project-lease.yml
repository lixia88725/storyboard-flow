name: Windows project lease verification

on:
  push:
    branches: [codex/windows-project-lease-test]
  pull_request:
    paths:
      - '.github/workflows/windows-project-lease.yml'
      - 'native/photocraft/Cargo.*'
      - 'native/photocraft/src/bin/flow-project-lease.rs'
      - 'native/photocraft/src/bin/lease/**'
      - 'src/platform/main/imageProjectLease*.ts'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  project-lease:
    runs-on: windows-latest
    env:
      RUSTUP_TOOLCHAIN: '1.99.1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: rustup toolchain install 1.99.1 --profile minimal --no-self-update
      - run: npm run setup:photocraft
      - run: python native/photocraft/apply-host-patches.py
      - name: Fetch the locked native dependencies
        run: cargo fetch --locked --manifest-path native/photocraft/Cargo.toml --target x86_64-pc-windows-msvc
      - name: Build the Windows project lease
        run: cargo build --offline --locked --manifest-path native/photocraft/Cargo.toml --bin flow-project-lease --target x86_64-pc-windows-msvc
      - name: Verify Windows project lease behavior
        shell: pwsh
        run: |
          $env:FLOW_PROJECT_LEASE_BINARY = Join-Path $env:GITHUB_WORKSPACE 'native/photocraft/target/x86_64-pc-windows-msvc/debug/flow-project-lease.exe'
          $env:TEMP = $env:RUNNER_TEMP
          node node_modules/vitest/vitest.mjs run src/platform/main/imageProjectLease.test.ts
